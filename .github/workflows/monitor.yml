name: Movie Ticket Monitor

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI / dashboard
    inputs:
      force_check:
        description: 'Force check even if already alerted'
        required: false
        default: 'false'
        type: boolean
      test_alerts:
        description: 'Send test alert notification to verify channels'
        required: false
        default: 'false'
        type: boolean
  push:
    paths-ignore:
      - 'state.json'
      - 'README.md'

# Ensure only one monitor run is active at a time; cancels old runs if config updates
concurrency:
  group: movie-ticket-monitor
  cancel-in-progress: true

env:
  TZ: 'Asia/Kolkata'
  # Movie & Theater config (override config.json)
  MOVIE_NAME: ${{ secrets.MOVIE_NAME }}
  THEATER_NAME: ${{ secrets.THEATER_NAME }}
  CITY: ${{ secrets.CITY }}
  CITY_CODE: ${{ secrets.CITY_CODE }}
  TARGET_DATE: ${{ secrets.TARGET_DATE }}

  # Platform toggles
  CHECK_BMS: 'true'
  CHECK_PVR: 'true'
  CHECK_DISTRICT: 'true'

  # Alert credentials (from GitHub Secrets)
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  DISCORD_ENABLED: ${{ secrets.DISCORD_ENABLED }}
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  NTFY_ENABLED: ${{ secrets.NTFY_ENABLED }}

  ACTIVE: 'true'

jobs:
  check-bookings:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (checks every 2.5 minutes for ~30 minutes per run)
        run: |
          if [ "${{ github.event.inputs.test_alerts }}" = "true" ]; then
            python monitor.py --test-alerts
          else
            python monitor.py --iterations 12 --interval 150
          fi

      - name: Commit state changes
        if: always()
        run: |
          git config user.name "Movie Alert Bot"
          git config user.email "movie-alert-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "🎬 Update alert state [$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')]"
          git push || true

      - name: Continuous Loop (Self-dispatch next run)
        if: always() && github.event.inputs.test_alerts != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "🚀 Self-chaining: Dispatching next monitor cycle via GitHub API..."
            curl -s -X POST \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token $GH_PAT" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches \
              -d '{"ref":"main"}' || true
          else
            echo "ℹ️ GH_PAT secret not provided. Scheduled cron will trigger next run."
          fi
